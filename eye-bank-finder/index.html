<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Bank Location Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Eye Bank Location Finder</h1>
        <p>Locate nearby eye banks quickly and easily[cite: 1].</p>
    </header>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Enter city or area (e.g., Bangalore)...">
            <button id="searchBtn">Search</button>
        </div>

        <section class="results-section">
            <h2>Available Eye Banks</h2>
            <div id="resultsContainer" class="results-grid">
                <!-- Dynamic results will load here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Navyashree S. Developed for community welfare and healthcare support.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
